services:
  postgres-e2e:
    image: postgres:16-alpine
    container_name: financeiro-postgres-e2e
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: financeiro_e2e
    ports:
      - "5433:5432"
    volumes:
      - postgres_e2e_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d financeiro_e2e"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    container_name: financeiro-api
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    working_dir: /app
    ports:
      - "3000:3000"
    env_file:
      - ./apps/api/.env
    volumes:
      - ./apps/api:/app
      - api_node_modules:/app/node_modules
    command: pnpm start:dev
  web:
    container_name: financeiro-web
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    working_dir: /app
    ports:
      - "3001:3001"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:3000
    volumes:
      - ./apps/web:/app
      - web_node_modules:/app/node_modules
    command: pnpm dev --port 3001

volumes:
  postgres_e2e_data:
  api_node_modules:
  web_node_modules:
